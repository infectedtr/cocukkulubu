<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aidat Takip - Yükleniyor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e6edf3;
            overflow: hidden;
            user-select: none;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
            animation: fadeIn 0.6s ease;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #238636, #2ea043);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 32px rgba(35, 134, 54, 0.4);
        }

        .logo-text h1 {
            font-size: 26px;
            font-weight: 700;
            color: #e6edf3;
            letter-spacing: -0.5px;
        }

        .logo-text p {
            font-size: 13px;
            color: #8b949e;
            margin-top: 2px;
        }

        .spinner-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #21262d;
            border-top-color: #2ea043;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            font-size: 14px;
            color: #8b949e;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        .progress-bar-wrap {
            width: 240px;
            height: 3px;
            background: #21262d;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #238636, #2ea043);
            border-radius: 99px;
            animation: progress 2.5s ease-in-out forwards;
        }

        .version {
            position: fixed;
            bottom: 20px;
            font-size: 11px;
            color: #484f58;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50%       { opacity: 1; }
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        @keyframes progress {
            0%   { width: 0%; }
            30%  { width: 45%; }
            70%  { width: 75%; }
            90%  { width: 88%; }
            100% { width: 92%; }
        }
    </style>
</head>
<body>
    <div class="logo-wrap">
        <div class="logo-icon">💰</div>
        <div class="logo-text">
            <h1>Aidat Takip</h1>
            <p>Zübeyde Hanım Çocuk Kulübü</p>
        </div>
    </div>

    <div class="spinner-wrap">
        <div class="spinner"></div>
        <div class="loading-text">Uygulama başlatılıyor<span class="dots"></span></div>
        <div class="progress-bar-wrap">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="version">v1.6</div>
</body>
</html>
